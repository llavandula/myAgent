<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Chat</title>
<style>
  :root {
    --bg: #1a1a2e;
    --surface: #16213e;
    --surface2: #0f3460;
    --accent: #e94560;
    --text: #eee;
    --text2: #aaa;
    --user-bubble: #0f3460;
    --ai-bubble: #1a1a2e;
    --tool-bg: #2a2a4a;
    --tool-accent: #00d2ff;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--text);
    display: flex; justify-content: center; align-items: center;
    height: 100vh; overflow: hidden;
  }
  .app {
    width: 100%; max-width: 760px; height: 100vh;
    display: flex; flex-direction: column;
    background: var(--surface);
  }

  /* 顶栏 */
  .header {
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    border-bottom: 1px solid rgba(255,255,255,.08);
    flex-shrink: 0;
  }
  .header h1 { font-size: 18px; font-weight: 600; }
  .header .dot { color: #4ade80; margin-right: 6px; }
  .btn-reset {
    background: none; border: 1px solid rgba(255,255,255,.15);
    color: var(--text2); padding: 6px 14px; border-radius: 6px;
    cursor: pointer; font-size: 13px; transition: .2s;
  }
  .btn-reset:hover { border-color: var(--accent); color: var(--accent); }

  /* 消息区 */
  .messages {
    flex: 1; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 16px;
    scroll-behavior: smooth;
  }
  .empty-state {
    flex: 1; display: flex; align-items: center; justify-content: center;
    color: var(--text2); font-size: 15px;
  }

  /* 聊天气泡 */
  .msg { display: flex; flex-direction: column; max-width: 85%; animation: fadeIn .25s; }
  .msg.user { align-self: flex-end; }
  .msg.agent { align-self: flex-start; }
  .msg .label {
    font-size: 11px; color: var(--text2); margin-bottom: 4px;
  }
  .msg .bubble {
    padding: 12px 16px; border-radius: 12px; line-height: 1.6;
    font-size: 14px; white-space: pre-wrap; word-break: break-word;
  }
  .msg.user .bubble { background: var(--user-bubble); border-bottom-right-radius: 4px; }
  .msg.agent .bubble { background: var(--ai-bubble); border: 1px solid rgba(255,255,255,.06); border-bottom-left-radius: 4px; }

  /* 工具调用卡片 */
  .tool-block {
    background: var(--tool-bg);
    border-left: 3px solid var(--tool-accent);
    border-radius: 6px; padding: 10px 14px; margin: 4px 0;
    font-size: 13px;
    animation: fadeIn .25s;
    align-self: flex-start; max-width: 85%;
  }
  .tool-block .tool-name { color: var(--tool-accent); font-weight: 600; margin-bottom: 4px; }
  .tool-block .tool-args { color: var(--text2); font-size: 12px; margin-bottom: 6px; }
  .tool-block .tool-result { color: #86efac; font-size: 12px; word-break: break-word; }
  .tool-block .tool-label { font-size: 10px; color: var(--text2); text-transform: uppercase; margin-top: 2px; }

  /* 加载动画 */
  .loading {
    align-self: flex-start; display: flex; gap: 6px; padding: 12px 16px;
  }
  .loading span {
    width: 8px; height: 8px; border-radius: 50%; background: var(--text2);
    animation: bounce 1.2s infinite;
  }
  .loading span:nth-child(2) { animation-delay: .2s; }
  .loading span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity: .3; }
    40% { transform: translateY(-8px); opacity: 1; }
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } }

  /* 输入区 */
  .input-area {
    display: flex; gap: 10px; padding: 14px 20px;
    border-top: 1px solid rgba(255,255,255,.08);
    flex-shrink: 0; background: var(--surface);
  }
  .input-area input {
    flex: 1; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1);
    border-radius: 10px; padding: 12px 16px; color: var(--text);
    font-size: 14px; outline: none; transition: .2s;
  }
  .input-area input:focus { border-color: var(--accent); }
  .input-area input::placeholder { color: var(--text2); }
  .input-area button {
    background: var(--accent); border: none; border-radius: 10px;
    padding: 12px 20px; color: #fff; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: .2s;
  }
  .input-area button:hover { opacity: .85; }
  .input-area button:disabled { opacity: .4; cursor: not-allowed; }
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <h1><span class="dot">●</span>Agent Chat</h1>
    <button class="btn-reset" onclick="doReset()">⟳ 新对话</button>
  </div>

  <div class="messages" id="messages">
    <div class="empty-state">输入消息开始对话</div>
  </div>

  <div class="input-area">
    <input type="text" id="input" placeholder="输入消息..." onkeydown="if(event.key==='Enter')send()" autofocus>
    <button id="sendBtn" onclick="send()">发送</button>
  </div>
</div>

<script>
const sessionId = (() => {
  let id = localStorage.getItem('agent_session_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('agent_session_id', id); }
  return id;
})();

const msgBox = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

function scrollBottom() { msgBox.scrollTop = msgBox.scrollHeight; }

function clearEmpty() {
  const empty = msgBox.querySelector('.empty-state');
  if (empty) empty.remove();
}

function addMessage(role, content) {
  clearEmpty();
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  div.innerHTML = `<div class="label">${role === 'user' ? '你' : 'Agent'}</div>
                   <div class="bubble">${escapeHtml(content)}</div>`;
  msgBox.appendChild(div);
  scrollBottom();
  return div;
}

function addToolBlock(toolName, args) {
  clearEmpty();
  const div = document.createElement('div');
  div.className = 'tool-block';
  const argsStr = args && Object.keys(args).length
    ? Object.entries(args).map(([k,v]) => `${k}=${JSON.stringify(v)}`).join(', ')
    : '无参数';
  div.innerHTML = `<div class="tool-name">🔧 ${toolName}</div>
                   <div class="tool-args">参数: ${argsStr}</div>`;
  div._toolName = toolName;
  msgBox.appendChild(div);
  scrollBottom();
  return div;
}

function appendToolResult(block, result) {
  const el = document.createElement('div');
  el.className = 'tool-result';
  el.innerHTML = `<span class="tool-label">返回:</span> ${escapeHtml(result)}`;
  block.appendChild(el);
  scrollBottom();
}

function addLoading() {
  clearEmpty();
  const div = document.createElement('div');
  div.className = 'loading';
  div.id = 'loading';
  div.innerHTML = '<span></span><span></span><span></span>';
  msgBox.appendChild(div);
  scrollBottom();
}

function removeLoading() {
  const el = document.getElementById('loading');
  if (el) el.remove();
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function send() {
  const msg = inputEl.value.trim();
  if (!msg) return;
  inputEl.value = '';
  sendBtn.disabled = true;

  addMessage('user', msg);
  addLoading();

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionId }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let currentToolBlock = null;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('event: ')) {
          const eventType = line.slice(7);
          const dataLine = lines[i + 1] || '';
          if (!dataLine.startsWith('data: ')) continue;

          let data;
          try { data = JSON.parse(dataLine.slice(6)); } catch { continue; }

          switch (eventType) {
            case 'tool_call':
              currentToolBlock = addToolBlock(data.tool, data.args);
              break;
            case 'tool_result':
              if (currentToolBlock) {
                appendToolResult(currentToolBlock, data.result);
              }
              break;
            case 'text':
              removeLoading();
              addMessage('agent', data.content);
              break;
            case 'error':
              removeLoading();
              addMessage('agent', '❌ 错误: ' + data.content);
              break;
            case 'done':
              removeLoading();
              break;
          }
        }
      }
    }
  } catch (e) {
    removeLoading();
    addMessage('agent', '❌ 网络错误: ' + e.message);
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

async function doReset() {
  await fetch('/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId }),
  });
  msgBox.innerHTML = '<div class="empty-state">对话已重置，开始新的对话吧</div>';
}
</script>
</body>
</html>
