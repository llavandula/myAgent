<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent Chat</title>
<style>
  /* ========= 浅色主题（默认） ========= */
  [data-theme="light"] {
    --bg-primary: #ffffff;
    --bg-secondary: #f7f7f8;
    --bg-tertiary: #ececf1;
    --border: #e5e5e5;
    --text-primary: #1a1a2e;
    --text-secondary: #6e6e80;
    --text-tertiary: #9a9aaf;
    --brand: #10a37f;
    --brand-hover: #0d8c6d;
    --user-msg-bg: var(--bg-primary);
    --agent-msg-bg: var(--bg-secondary);
    --avatar-user-bg: #d9d9e3;
    --avatar-user-text: #565869;
    --tool-bg: #f0f0f5;
    --tool-border: #10a37f;
    --input-bg: #ffffff;
    --input-border: #d9d9e3;
    --code-bg: #f0f0f5;
    --pre-bg: #1a1a2e;
    --pre-text: #e5e5e5;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
  }

  /* ========= 深色主题 ========= */
  [data-theme="dark"] {
    --bg-primary: #343541;
    --bg-secondary: #444654;
    --bg-tertiary: #40414f;
    --border: #565869;
    --text-primary: #ececf1;
    --text-secondary: #acacbe;
    --text-tertiary: #8e8ea0;
    --brand: #19c99a;
    --brand-hover: #10a37f;
    --user-msg-bg: var(--bg-primary);
    --agent-msg-bg: var(--bg-secondary);
    --avatar-user-bg: #565869;
    --avatar-user-text: #d9d9e3;
    --tool-bg: #2d2d3d;
    --tool-border: #19c99a;
    --input-bg: #40414f;
    --input-border: #565869;
    --code-bg: rgba(0,0,0,.35);
    --pre-bg: #000000;
    --pre-text: #e5e5e5;
    --shadow: 0 1px 3px rgba(0,0,0,.25);
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    transition: background .3s, color .3s;
  }

  /* 顶部栏 */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 16px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    transition: border-color .3s;
  }
  .btn-new-chat {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 7px 16px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-primary);
    color: var(--text-primary);
    font-size: 13px;
    cursor: pointer;
    transition: .15s;
  }
  .btn-new-chat:hover {
    border-color: var(--brand);
    color: var(--brand);
  }
  .btn-new-chat svg { width: 15px; height: 15px; }

  /* 消息滚动区 */
  .chat-body {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  /* 空状态 */
  .empty-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--text-tertiary);
  }
  .empty-state svg { width: 48px; height: 48px; opacity: .35; }
  .empty-state svg path { stroke: var(--text-tertiary); }
  .empty-state h2 { font-size: 22px; font-weight: 500; color: var(--text-secondary); }
  .empty-state p { font-size: 14px; }

  /* 每条消息 */
  .msg-row {
    padding: 14px 16px;
    display: flex;
    gap: 16px;
    animation: fadeIn .25s ease;
    transition: background .3s;
  }
  .msg-row.user { background: var(--user-msg-bg); }
  .msg-row.agent { background: var(--agent-msg-bg); }

  .msg-row .avatar {
    width: 30px; height: 30px;
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    font-size: 12px; font-weight: 700;
  }
  .msg-row.user .avatar { background: var(--avatar-user-bg); color: var(--avatar-user-text); }
  .msg-row.agent .avatar { background: var(--brand); color: #fff; }

  .msg-row .content {
    flex: 1;
    max-width: 800px;
    line-height: 1.8;
    font-size: 15px;
    white-space: pre-wrap;
    word-break: break-word;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* ===== 工具组 — 默认折叠，紧凑汇总 ===== */
  .tool-row {
    padding: 3px 16px 3px 62px;
    background: var(--agent-msg-bg);
    transition: background .3s;
    animation: fadeIn .25s ease;
  }
  .tool-group {
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    background: var(--tool-bg);
    font-size: 13px;
  }
  .tool-group-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    cursor: pointer;
    user-select: none;
    color: var(--text-secondary);
    transition: background .15s;
  }
  .tool-group-header:hover { background: var(--bg-tertiary); }
  .tool-group-header .arrow {
    font-size: 9px;
    transition: transform .2s;
    flex-shrink: 0;
  }
  .tool-group.open .tool-group-header .arrow { transform: rotate(90deg); }
  .tool-group-header .summary {
    flex: 1;
    font-size: 12px;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .tool-group-header .summary.pulse {
    color: var(--brand);
  }
  .tool-group-header .group-status {
    font-size: 14px;
    flex-shrink: 0;
  }
  .tool-group-body { display: none; }
  .tool-group.open .tool-group-body {
    display: block;
    padding: 0 10px 8px;
  }

  /* 工具项列表 */
  .tool-item {
    padding: 6px 0;
    border-top: 1px solid var(--border);
    font-size: 12px;
  }
  .tool-item:first-child { border-top: none; }
  .tool-item-header {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    color: var(--text-secondary);
    user-select: none;
  }
  .tool-item-header:hover { color: var(--text-primary); }
  .tool-item-icon { font-size: 12px; flex-shrink: 0; width: 16px; text-align: center; }
  .tool-item-icon.running { color: var(--brand); }
  .tool-item-icon.success { color: #10a37f; }
  .tool-item-icon.error { color: #e74c3c; }
  .tool-item-name { font-weight: 500; flex-shrink: 0; }
  .tool-item-args {
    flex: 1;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-tertiary);
    font-size: 11px;
  }
  .tool-item-time {
    font-size: 11px;
    color: var(--text-tertiary);
    flex-shrink: 0;
  }
  .tool-item-result {
    display: none;
    margin-top: 4px;
    padding: 6px 8px;
    background: var(--bg-secondary);
    border-radius: 4px;
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-primary);
    white-space: pre-wrap;
    word-break: break-word;
    max-height: 200px;
    overflow-y: auto;
  }
  .tool-item.result-open .tool-item-result { display: block; }
  .tool-item-result .truncated {
    color: var(--brand);
    cursor: pointer;
    font-size: 11px;
    margin-top: 4px;
    display: inline-block;
  }
  .tool-item-result .truncated:hover { text-decoration: underline; }

  /* 关键动画：脉冲点 */
  @keyframes pulse {
    0%, 100% { opacity: .5; }
    50% { opacity: 1; }
  }
  .tool-item-icon.running {
    animation: pulse 1s ease-in-out infinite;
  }

  /* 加载动画 */
  .loading {
    padding: 24px 16px;
    display: flex;
    gap: 6px;
    background: var(--agent-msg-bg);
    transition: background .3s;
  }
  .loading .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--text-tertiary);
    animation: bounce 1.4s infinite;
  }
  .loading .dot:nth-child(2) { animation-delay: .2s; }
  .loading .dot:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce {
    0%,80%,100% { transform: translateY(0); opacity: .25; }
    40% { transform: translateY(-5px); opacity: 1; }
  }

  /* 底部输入区 */
  .chat-footer {
    padding: 12px 16px 24px;
    background: var(--bg-primary);
    flex-shrink: 0;
    transition: background .3s;
  }
  .input-wrapper {
    max-width: 816px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    padding: 8px 8px 8px 16px;
    transition: .2s;
    box-shadow: var(--shadow);
  }
  .input-wrapper:focus-within {
    border-color: var(--brand);
    box-shadow: 0 0 0 2px rgba(16,163,127,.2);
  }
  .input-wrapper textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text-primary);
    font-size: 15px;
    font-family: inherit;
    resize: none;
    max-height: 150px;
    line-height: 1.5;
    padding: 4px 0;
  }
  .input-wrapper textarea::placeholder { color: var(--text-tertiary); }
  .input-wrapper button {
    width: 36px; height: 36px;
    border-radius: 8px;
    border: none;
    background: var(--text-tertiary);
    color: #fff;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: .15s;
  }
  .input-wrapper button:not(:disabled):hover { background: var(--brand); }
  .input-wrapper button:disabled { opacity: .3; cursor: not-allowed; }
  .input-wrapper button svg { width: 16px; height: 16px; }

  .footer-row {
    max-width: 816px;
    margin: 8px auto 0;
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 11px;
    color: var(--text-tertiary);
  }
  .footer-row a {
    color: var(--text-tertiary);
    text-decoration: none;
    cursor: pointer;
    transition: .15s;
  }
  .footer-row a:hover { color: var(--brand); }

  /* 主题切换按钮 */
  .theme-toggle {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    background: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 4px;
    transition: .2s;
  }
  .theme-toggle:hover { border-color: var(--brand); }
  .theme-toggle .option {
    padding: 3px 10px;
    border-radius: 16px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: .2s;
    color: var(--text-tertiary);
  }
  .theme-toggle .option.active {
    background: var(--brand);
    color: #fff;
  }
  .theme-toggle .option svg { width: 14px; height: 14px; }

  /* 滚动条 */
  .chat-body::-webkit-scrollbar { width: 6px; }
  .chat-body::-webkit-scrollbar-track { background: transparent; }
  .chat-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* 代码 */
  .msg-row .content code {
    background: var(--code-bg);
    padding: 2px 6px;
    border-radius: 4px;
    font-size: 13px;
  }
  .msg-row .content pre {
    background: var(--pre-bg);
    color: var(--pre-text);
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
    margin: 8px 0;
  }
  .msg-row .content pre code { background: none; padding: 0; color: inherit; }

  /* ===== Markdown 排版 ===== */
  .msg-row .content > :first-child { margin-top: 0; }
  .msg-row .content > :last-child { margin-bottom: 0; }
  .msg-row .content h1,
  .msg-row .content h2,
  .msg-row .content h3,
  .msg-row .content h4 {
    margin: 16px 0 8px;
    line-height: 1.4;
    font-weight: 600;
  }
  .msg-row .content h1 { font-size: 22px; }
  .msg-row .content h2 { font-size: 19px; }
  .msg-row .content h3 { font-size: 17px; }
  .msg-row .content p { margin: 0 0 10px; }
  .msg-row .content ul,
  .msg-row .content ol { margin: 0 0 10px; padding-left: 22px; }
  .msg-row .content li { margin: 4px 0; }
  .msg-row .content blockquote {
    margin: 0 0 10px;
    padding: 4px 12px;
    border-left: 3px solid var(--border);
    color: var(--text-secondary);
  }
  .msg-row .content a { color: var(--brand); text-decoration: underline; }
  .msg-row .content table {
    border-collapse: collapse;
    margin: 0 0 10px;
    font-size: 14px;
  }
  .msg-row .content th,
  .msg-row .content td {
    border: 1px solid var(--border);
    padding: 6px 10px;
  }

  /* 响应式 */
  @media (max-width: 640px) {
    .msg-row { padding: 16px 10px; gap: 10px; }
    .msg-row .content { font-size: 14px; }
    .chat-footer { padding: 10px 10px 16px; }
  }
</style>
<!-- Markdown 渲染：marked 负责解析，DOMPurify 负责清洗防 XSS -->
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>

<div class="topbar">
  <button class="btn-new-chat" onclick="doReset()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/><path d="M9 12h6M12 9v6"/></svg>
    新对话
  </button>
  <div class="theme-toggle" onclick="toggleTheme()" id="themeToggle">
    <span class="option active" data-theme-val="light">Light</span>
    <span class="option" data-theme-val="dark">Dark</span>
  </div>
</div>

<div class="chat-body" id="chatBody">
  <div class="empty-state">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
    </svg>
    <h2>有什么可以帮你的？</h2>
    <p>你可以问问题、让 Agent 帮你计算或获取信息</p>
  </div>
</div>

<div class="chat-footer">
  <div class="input-wrapper">
    <textarea id="input" placeholder="发送消息..." rows="1" onkeydown="handleKey(event)"></textarea>
    <button id="sendBtn" onclick="send()" title="发送">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
  <div class="footer-row">
    <span>按 Enter 发送，Shift+Enter 换行</span>
  </div>
</div>

<script>
// ====== 主题 ======
const html = document.documentElement;
const savedTheme = localStorage.getItem('theme') || 'light';
html.setAttribute('data-theme', savedTheme);
updateThemeToggle(savedTheme);

function toggleTheme() {
  const current = html.getAttribute('data-theme');
  const next = current === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeToggle(next);
}

function updateThemeToggle(theme) {
  document.querySelectorAll('.theme-toggle .option').forEach(el => {
    el.classList.toggle('active', el.dataset.themeVal === theme);
  });
}

// ====== 会话 ======
const sessionId = (() => {
  let id = localStorage.getItem('agent_session_id');
  if (!id) { id = crypto.randomUUID(); localStorage.setItem('agent_session_id', id); }
  return id;
})();

const chatBody = document.getElementById('chatBody');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 150) + 'px';
});

function scrollBottom() {
  chatBody.scrollTop = chatBody.scrollHeight;
}

function clearEmpty() {
  const empty = chatBody.querySelector('.empty-state');
  if (empty) empty.remove();
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
}

function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function renderMarkdown(text) {
  // CDN 没加载成功时降级为纯文本,避免白屏
  if (typeof marked === 'undefined') return escapeHtml(text);

  // 预处理：修正 AI 常见的非标准 markdown 格式
  // 1. "文字###数字." 内联伪标题 → 独立标题行
  text = text.replace(/(\S)(#{1,6})(\d+[\.\、])/g, '$1\n\n$2$3');
  // 2. "###数字." 行首但后面没空格 → 补空格（markdown 标准要求 # 后有空格）
  text = text.replace(/^(#{1,6})(\d+[\.\、])(?!\s)/gm, '$1 $2');

  let html = marked.parse(text, { breaks: true, gfm: true });
  if (typeof DOMPurify !== 'undefined') html = DOMPurify.sanitize(html);
  return html;
}

function formatMarkdown(text) {
  return renderMarkdown(text);
}

function addMessage(role, content) {
  clearEmpty();
  const row = document.createElement('div');
  row.className = `msg-row ${role}`;

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = role === 'user' ? 'U' : 'AI';

  const contentDiv = document.createElement('div');
  contentDiv.className = 'content';
  contentDiv.innerHTML = role === 'user' ? escapeHtml(content) : formatMarkdown(content);

  row.appendChild(avatar);
  row.appendChild(contentDiv);
  chatBody.appendChild(row);
  scrollBottom();
  return row;
}

function addStreamingMsg() {
  clearEmpty();
  const row = document.createElement('div');
  row.className = 'msg-row agent';

  const avatar = document.createElement('div');
  avatar.className = 'avatar';
  avatar.textContent = 'AI';

  const contentDiv = document.createElement('div');
  contentDiv.className = 'content';

  row.appendChild(avatar);
  row.appendChild(contentDiv);
  chatBody.appendChild(row);
  scrollBottom();
  return row;
}

// ====== 工具组系统 ======
let toolGroupData = null;   // { tools[], completed, startTime }

function createToolGroup() {
  clearEmpty();
  const row = document.createElement('div');
  row.className = 'tool-row';
  row.innerHTML = `
    <div class="tool-group open">
      <div class="tool-group-header" onclick="this.parentElement.classList.toggle('open')">
        <span class="arrow">▶</span>
        <span class="summary pulse">正在执行...</span>
        <span class="group-status">⋯</span>
      </div>
      <div class="tool-group-body"></div>
    </div>
  `;
  chatBody.appendChild(row);
  scrollBottom();
  return row.querySelector('.tool-group');
}

function addToolToGroup(group, id, toolName, args) {
  const body = group.querySelector('.tool-group-body');
  const argsStr = args && Object.keys(args).length
    ? Object.entries(args).map(([k, v]) => `${k}=${JSON.stringify(v)}`).join(', ')
    : '';
  const div = document.createElement('div');
  div.className = 'tool-item';
  div.dataset.toolId = id;
  div.innerHTML = `
    <div class="tool-item-header" onclick="this.parentElement.classList.toggle('result-open')">
      <span class="tool-item-icon running">◌</span>
      <span class="tool-item-name">${escapeHtml(toolName)}</span>
      <span class="tool-item-args">${escapeHtml(argsStr)}</span>
      <span class="tool-item-time">⋯</span>
    </div>
    <div class="tool-item-result"><div class="tool-item-result-content"></div></div>
  `;
  body.appendChild(div);
  updateGroupSummary(group);
  scrollBottom();
}

function updateToolInGroup(group, id, resultText, duration, status) {
  const item = group.querySelector(`.tool-item[data-tool-id="${id}"]`);
  if (!item) return;
  const icon = item.querySelector('.tool-item-icon');
  const timeEl = item.querySelector('.tool-item-time');
  const resultContent = item.querySelector('.tool-item-result-content');

  icon.className = `tool-item-icon ${status}`;
  icon.textContent = status === 'success' ? '✓' : status === 'error' ? '✗' : '⋯';
  timeEl.textContent = duration != null ? `${duration}s` : '—';

  // 结果显示：截断过长内容
  const MAX_PREVIEW = 200;
  if (resultText && resultText.length > MAX_PREVIEW) {
    const preview = resultText.slice(0, MAX_PREVIEW);
    resultContent.innerHTML = `${escapeHtml(preview)}<span class="truncated">...展开完整结果</span>`;
    resultContent.querySelector('.truncated').onclick = function(e) {
      e.stopPropagation();
      this.parentElement.textContent = resultText;
    };
  } else {
    resultContent.textContent = resultText || '(空)';
  }

  // 失败时自动展开该项
  if (status === 'error') {
    item.classList.add('result-open');
    // 展开整个工具组
    group.classList.add('open');
  }

  // 更新工具组状态
  updateGroupSummary(group);
  scrollBottom();
}

function updateGroupSummary(group) {
  const tools = group.querySelectorAll('.tool-item');
  const header = group.querySelector('.tool-group-header');
  const summary = header.querySelector('.summary');
  const groupStatus = header.querySelector('.group-status');

  let total = tools.length;
  let completed = 0;
  let hasError = false;
  let totalTime = 0;
  let timeCount = 0;

  tools.forEach(t => {
    const icon = t.querySelector('.tool-item-icon');
    const timeText = t.querySelector('.tool-item-time').textContent;
    if (icon.classList.contains('success')) { completed++; totalTime += parseFloat(timeText) || 0; timeCount++; }
    else if (icon.classList.contains('error')) { completed++; hasError = true; }
  });

  let isRunning = completed < total;

  if (isRunning) {
    summary.className = 'summary pulse';
    summary.textContent = `正在执行 ${completed+1}/${total}...`;
    groupStatus.textContent = '⋯';
    group.classList.add('open');  // 执行中自动展开
  } else {
    summary.className = 'summary';
    const avgTime = timeCount > 0 ? (totalTime / timeCount).toFixed(2) : '?';
    const maxTime = timeCount > 0 ? Math.max(...Array.from(tools).map(t => {
      const v = parseFloat(t.querySelector('.tool-item-time').textContent);
      return isNaN(v) ? 0 : v;
    })).toFixed(2) : '?';
    summary.textContent = `✓ 已完成 ${total} 个工具 · ${maxTime}s`;
    if (hasError) summary.textContent = `✗ 完成 ${total} 个工具（含错误）· ${maxTime}s`;
    groupStatus.textContent = hasError ? '✗' : '✓';
    if (!hasError) group.classList.remove('open');  // 全成功则折叠
    scrollBottom();
  }
}

function addLoading() {
  clearEmpty();
  const div = document.createElement('div');
  div.className = 'loading';
  div.id = 'loading';
  div.innerHTML = '<div class="dot"></div><div class="dot"></div><div class="dot"></div>';
  chatBody.appendChild(div);
  scrollBottom();
}

function removeLoading() {
  const el = document.getElementById('loading');
  if (el) el.remove();
}

// ====== 发送消息 ======
async function send() {
  const msg = inputEl.value.trim();
  if (!msg) return;
  inputEl.value = '';
  inputEl.style.height = 'auto';
  sendBtn.disabled = true;

  addMessage('user', msg);
  addLoading();

  try {
    const resp = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: msg, session_id: sessionId }),
    });

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';
    let toolGroup = null;       // 当前工具组 DOM
    let streamingMsg = null;   // 正在流式输出的消息 DOM 元素
    let streamingDiv = null;   // 消息中的 content div
    let streamingText = '';    // 累积的纯文本,用于 markdown 实时渲染

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop() || '';

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        if (line.startsWith('event: ')) {
          const eventType = line.slice(7);
          const dataLine = lines[i + 1] || '';
          if (!dataLine.startsWith('data: ')) continue;

          let data;
          try { data = JSON.parse(dataLine.slice(6)); } catch { continue; }

          switch (eventType) {
            case 'tool_call':
              removeLoading();
              streamingMsg = null;  // 工具调用打断文本流
              streamingText = '';   // 重置累积文本
              if (!toolGroup) toolGroup = createToolGroup();
              addToolToGroup(toolGroup, data.id, data.tool, data.args);
              break;
            case 'tool_result':
              if (toolGroup) updateToolInGroup(toolGroup, data.id, data.result, data.duration, data.status);
              break;
            case 'text':
              removeLoading();
              // 工具组已完成 → 折叠
              if (toolGroup) { toolGroup = null; }
              streamingText += data.content;
              if (!streamingMsg) {
                // 第一个文本块：创建新的 AI 消息
                streamingMsg = addStreamingMsg();
                streamingDiv = streamingMsg.querySelector('.content');
              }
              // 实时把累积文本渲染成 markdown（支持流式逐字）
              streamingDiv.innerHTML = renderMarkdown(streamingText);
              scrollBottom();
              break;
            case 'error':
              removeLoading();
              streamingMsg = null;
              streamingText = '';
              toolGroup = null;
              addMessage('agent', '❌ 错误: ' + data.content);
              break;
            case 'done':
              removeLoading();
              // 最终再渲染一次,确保未闭合的代码块/列表等正确收尾
              if (streamingDiv) streamingDiv.innerHTML = renderMarkdown(streamingText);
              streamingMsg = null;
              streamingText = '';
              toolGroup = null;
              break;
          }
        }
      }
    }
  } catch (e) {
    removeLoading();
    addMessage('agent', '❌ 网络错误: ' + e.message);
  }

  sendBtn.disabled = false;
  inputEl.focus();
}

async function doReset() {
  await fetch('/reset', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ session_id: sessionId }),
  });
  chatBody.innerHTML = `
    <div class="empty-state">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
      </svg>
      <h2>对话已重置</h2>
      <p>开始新的对话吧</p>
    </div>
  `;
}
